spring.application.name=Drive-Service
server.port=8091
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
spring.boot.admin.client.url=http://localhost:1111
# Persistent File-Based H2 Database URL (creates/uses a folder named 'data' in your project root)
spring.datasource.url=jdbc:h2:file:./data/drive

# Database Driver and Credentials
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.max-file-size=10MB
spring.mvc.problemdetails.enabled=true
#Niche vali line se actuator ke sare endpoints maise only health and info hi expose honge baki nhi
management.endpoints.web.exposure.include=*
drive.storage.url=http://localhost:8092