spring.application.name=Storage-Service
server.port=8092

#To enable eureka client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

#To enable admin
spring.boot.admin.client.url=http://localhost:1111
spring.boot.admin.client.instance.service-base-url=http://localhost:8092
management.endpoints.web.exposure.include=*



spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.max-file-size=10MB
#Agr run time pr "DRIVE_STORAGE_DIR" mil gya to is location pr otherwise : ke bad vali location pr
storage.directory=${DRIVE_STORAGE_DIR:./data/objects}
debug=true
